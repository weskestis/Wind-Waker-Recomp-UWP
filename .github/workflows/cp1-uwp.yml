name: CP6 Xbox Dawn CoreWindow and XAudio2

on:
  push:
    branches: [ cp6-graphics-audio ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x64-uwp:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Checkout Xbox port
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify pinned Wind Waker Recomp upstream
        shell: pwsh
        run: |
          $expected = "6def7cd4dcd792ba0b4d25ba9883f96debc8f1b3"
          git init upstream
          git -C upstream remote add origin https://github.com/elliotttate/Wind-Waker-Recomp.git
          git -C upstream fetch --depth=1 origin $expected
          $actual = (git -C upstream rev-parse FETCH_HEAD).Trim()
          if ($actual -ne $expected) { throw "Upstream pin mismatch: expected $expected, got $actual" }
          git -C upstream checkout --detach FETCH_HEAD
          "UPSTREAM_OK=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Fetch pinned RecompCore
        shell: pwsh
        run: |
          $expected = "634895470af6e61e601f06a351f3a72888215159"
          New-Item -ItemType Directory -Force -Path deps\recompcore | Out-Null
          git -C deps\recompcore init
          git -C deps\recompcore remote add origin https://github.com/elliotttate/RecompCore.git
          git -C deps\recompcore fetch --depth=1 origin $expected
          $actual = (git -C deps\recompcore rev-parse FETCH_HEAD).Trim()
          if ($actual -ne $expected) { throw "RecompCore pin mismatch: expected $expected, got $actual" }
          git -C deps\recompcore checkout --detach FETCH_HEAD
          "RECOMPCORE_OK=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build pinned Dawn for UWP
        shell: pwsh
        run: |
          $expected = "266c1cf8de969a364afa4fa49311631fc99a881e"
          $src = Join-Path $env:GITHUB_WORKSPACE "deps\dawn-src"
          $build = Join-Path $env:GITHUB_WORKSPACE "deps\dawn-uwp-build"

          git init $src
          git -C $src remote add origin https://github.com/encounter/dawn.git
          git -C $src fetch --depth=1 origin $expected
          $actual = (git -C $src rev-parse FETCH_HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Dawn source pin mismatch: expected $expected, got $actual"
          }
          git -C $src checkout --detach FETCH_HEAD

          python "$src\tools\fetch_dawn_dependencies.py" -d $src

          # Dawn's Windows-version registry probe is desktop-only. Keep the
          # real WINUWP DXGI/D3D12 paths, but make this advisory probe inert.
          $platformFunctions = Join-Path $src "src\dawn\native\d3d\PlatformFunctions.cpp"
          $text = Get-Content $platformFunctions -Raw
          $open = "void PlatformFunctions::InitWindowsVersion() {`r`n"
          $openReplacement = "void PlatformFunctions::InitWindowsVersion() {`r`n#if DAWN_PLATFORM_IS(WINUWP)`r`n    mCurrentBuildNumber = 0;`r`n    return;`r`n#else`r`n"
          if (-not $text.Contains($open)) { throw "Dawn InitWindowsVersion opening context not found" }
          $text = $text.Replace($open, $openReplacement)
          $close = "    RegCloseKey(hKey);`r`n}"
          $closeReplacement = "    RegCloseKey(hKey);`r`n#endif`r`n}"
          if (-not $text.Contains($close)) { throw "Dawn InitWindowsVersion closing context not found" }
          $text = $text.Replace($close, $closeReplacement)
          Set-Content -Path $platformFunctions -Value $text -NoNewline
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          cmake -S $src -B $build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_SYSTEM_NAME=WindowsStore" `
            "-DCMAKE_SYSTEM_VERSION=10.0" `
            "-DCMAKE_VS_WINDOWS_TARGET_PLATFORM_VERSION=10.0.22621.0" `
            -DDAWN_BUILD_MONOLITHIC_LIBRARY=STATIC `
            -DBUILD_SHARED_LIBS=OFF `
            -DDAWN_ENABLE_D3D12=ON `
            -DDAWN_ENABLE_D3D11=OFF `
            -DDAWN_ENABLE_VULKAN=OFF `
            -DDAWN_ENABLE_NULL=OFF `
            -DDAWN_ENABLE_DESKTOP_GL=OFF `
            -DDAWN_ENABLE_OPENGLES=OFF `
            -DDAWN_USE_WINDOWS_UI=ON `
            -DDAWN_USE_GLFW=OFF `
            -DDAWN_USE_BUILT_DXC=OFF `
            -DDAWN_FORCE_SYSTEM_COMPONENT_LOAD=ON `
            -DDAWN_BUILD_SAMPLES=OFF `
            -DDAWN_BUILD_TESTS=OFF `
            -DDAWN_BUILD_BENCHMARKS=OFF `
            -DDAWN_BUILD_NODE_BINDINGS=OFF `
            -DDAWN_BUILD_PROTOBUF=OFF `
            -DTINT_BUILD_TESTS=OFF `
            -DTINT_BUILD_CMD_TOOLS=OFF `
            -DTINT_BUILD_BENCHMARKS=OFF `
            -DTINT_BUILD_FUZZERS=OFF

          cmake --build $build --config Release --target webgpu_dawn --parallel 4

          $lib = Get-ChildItem $build -Recurse -Filter webgpu_dawn.lib |
            Select-Object -First 1
          if ($null -eq $lib) {
            throw "UWP webgpu_dawn.lib was not produced"
          }

          $include = "$src\include;$build\gen\include"
          "DAWN_INCLUDE=$include" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DAWN_LIB=$($lib.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "UWP Dawn static lib: $($lib.FullName)"
          Write-Host "UWP Dawn include paths: $include"
      - name: Report UWP toolchain
        shell: pwsh
        run: |
          msbuild -version
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" -Directory | Select-Object -ExpandProperty Name

      - name: Generate neutral CP6 package assets
        shell: pwsh
        run: |
          $assetDir = Join-Path $env:GITHUB_WORKSPACE "xbox\bringup\Assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          function Write-Png([string]$name, [string]$base64) {
            [IO.File]::WriteAllBytes((Join-Path $assetDir $name), [Convert]::FromBase64String($base64))
          }
          Write-Png "StoreLogo.png" "iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAASUlEQVR42u3PMQ0AMAgAMMazdwLm3ya44CCtg577fsUCGUuIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIzGi9vQGWhr7RGgAAAABJRU5ErkJggg=="
          Write-Png "Square150x150Logo.png" ""
          Write-Png "Square44x44Logo.png" "iVBORw0KGgoAAAANSUhEUgAAACwAAAAsCAYAAAAehFoBAAAAQElEQVR42u3OQREAIAgAMOTD1wD2rwk58LYEO3VfxyIZywgLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwv/Fx60BAGK5DGV9QAAAABJRU5ErkJggg=="
          Write-Png "SplashScreen.png" ""

      - name: Generate ephemeral CP6 signing certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=WindWakerRecompUWP" `
            -KeyUsage DigitalSignature `
            -KeyExportPolicy Exportable `
            -FriendlyName "Wind Waker Recomp UWP CP6" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $password = ConvertTo-SecureString -String "cp6-temporary" -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP "WindWakerRecompUWP-CP6.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\artifacts\WindWakerRecompUWP-CP6.cer" | Out-Null
          "CP6_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build x64 UWP CP6
        shell: pwsh
        run: |
          msbuild xbox\bringup\BlueWakeUWP.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:DawnIncludeDir="$env:DAWN_INCLUDE" `
            /p:DawnLibDir="$env:DAWN_LIB" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:CP6_PFX" `
            /p:PackageCertificatePassword="cp6-temporary" `
            /p:PackageCertificateThumbprint="" `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts\AppPackages\"

      - name: Verify full GXRuntime static chassis
        shell: pwsh
        run: |
          $runtime = "$env:GITHUB_WORKSPACE\xbox\bringup\CP5Runtime.lib"
          if (-not (Test-Path $runtime)) { throw "CP5Runtime.lib was not produced" }
          if ((Get-Item $runtime).Length -lt 100000) { throw "CP5Runtime.lib is unexpectedly small" }

      - name: Verify production module exports
        shell: pwsh
        run: |
          $module = "$env:GITHUB_WORKSPACE\xbox\bringup\gGZLE01_recomp.dll"
          if (-not (Test-Path $module)) { throw "gGZLE01_recomp.dll was not produced" }
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $dumpbin) { throw "Visual Studio x64 dumpbin.exe not found" }
          $exports = (& $dumpbin.FullName /nologo /exports $module | Out-String)
          @(
            "staticrecomp_get_module", "bluewake_composite_guest_cpu", "bluewake_composite_guest_mem1",
            "bluewake_set_mem_write_journal", "bluewake_set_edge_service", "ppc_set_mem_write_journal",
            "ppc_guest_alias_clear", "ppc_guest_alias_add_shared", "ppc_guest_alias_get_storage",
            "ppc_guest_alias_remove", "ppc_guest_alias_resolve"
          ) | ForEach-Object { if ($exports -notmatch [regex]::Escape($_)) { throw "required module export missing: $_" } }

      - name: Verify CP6 imports and modules
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          $exe = "$env:GITHUB_WORKSPACE\xbox\bringup\x64\Release\BlueWakeUWP\BlueWakeUWP.exe"
          $imports = (& $dumpbin.FullName /nologo /imports $exe | Out-String)
          if ($imports -match 'webgpu_dawn\.dll') { throw "Desktop webgpu_dawn.dll must not be imported by repaired CP6" }
          if ($imports -match 'USER32\.dll') { throw "Desktop USER32.dll import detected in repaired CP6" }
          if ($imports -notmatch 'Windows\.Media\.Audio\.dll' -and
              $imports -notmatch 'XAudio2Create') {
            Write-Host "note: XAudio2 resolves through the UWP WindowsApp umbrella; runtime proof is the Xbox tone probe"
          }

          $package = "$env:GITHUB_WORKSPACE\artifacts\AppPackages\BlueWakeUWP_0.6.1.0_x64_Test\BlueWakeUWP_0.6.1.0_x64.msix"
          $unpack = Join-Path $env:RUNNER_TEMP "cp6-unpack"
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\makeappx.exe" unpack /p $package /d $unpack /o
          foreach ($name in @("CP3Module.dll", "gGZLE01_recomp.dll")) {
            if (-not (Test-Path (Join-Path $unpack $name))) { throw "$name is missing from the package" }
          }
          foreach ($forbidden in @("webgpu_dawn.dll", "dxcompiler.dll", "dxil.dll")) {
            if (Test-Path (Join-Path $unpack $forbidden)) { throw "desktop runtime $forbidden must not be packaged" }
          }
          Write-Host "CP6 UWP-static Dawn/XAudio2 package contract verified"

      - name: Inventory build output
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts) { Get-ChildItem artifacts -Recurse | Select-Object FullName, Length }
          if (Test-Path xbox\bringup\x64\Release) { Get-ChildItem xbox\bringup\x64\Release -Recurse | Select-Object FullName, Length }

      - name: Upload CP6 build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wind-Waker-Recomp-UWP-CP6-x64
          if-no-files-found: error
          path: |
            artifacts/**
            xbox/bringup/x64/Release/**
